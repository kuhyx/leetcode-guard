name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # conftest.py imports tkinter at module scope to keep the real
      # `tk.TclError` while replacing the rest of the module with a mock, so
      # even the fully-mocked suite needs tkinter present. setup-python's
      # interpreter already ships it on ubuntu-latest (the pre-commit job's
      # screens-fit hook builds real Tk widgets with no apt step at all), so
      # the 12 s apt install only runs if that ever stops being true.
      - name: Ensure tkinter
        run: |
          python -c 'import tkinter' || {
            sudo apt-get update
            sudo apt-get install -y python3-tk tk-dev
          }

      # uv with a cached wheel store installs requirements.txt in seconds;
      # plain pip took ~24 s here.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
          cache-suffix: test

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      # -n auto spreads the suite over every runner core (pytest-xdist is in
      # requirements.txt); pytest-cov merges the workers' coverage. The 100%
      # bar, --strict-* and the coverage flags all live in pyproject addopts;
      # -q only cancels its -v (one line per test was ~900 lines of log).
      - name: Run tests with coverage
        run: python -m pytest -n auto -q

  # The suite replaces the whole `tk` module so it can never reach a display,
  # which means the real widget tree is never exercised there. Every UI bug
  # this repo has had was invisible to assertions and visible only on screen:
  # a close button drawn behind the surfaces, an escape form whose first field
  # had no label, text wrapping wider than its own window. This job builds the
  # real windows against a throwaway X server so a crash or a missing widget
  # fails the build.
  real-tk-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # xvfb-run and setup-python's tkinter are both already on ubuntu-latest
      # (screens-fit in the pre-commit job re-execs under xvfb-run with no apt
      # step), so the apt install that made up most of a 63 s step only runs
      # if either goes missing.
      - name: Ensure Xvfb and tkinter
        run: |
          if ! python -c 'import tkinter' || ! command -v xvfb-run; then
            sudo apt-get update
            sudo apt-get install -y xvfb python3-tk tk-dev
          fi

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
          cache-suffix: real-tk-render

      # screenshot_states.py imports leetcode_guard directly rather than
      # through pytest, which would have put the rootdir on sys.path.
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -e . --no-deps

      - name: Every lock state builds real Tk widgets
        run: |
          for state in locked unlocked escape outage production; do
            echo "--- rendering: $state ---"
            xvfb-run -a -s "-screen 0 1600x1200x24" \
              python3 scripts/screenshot_states.py "$state"
          done

      - name: The status window builds real Tk widgets
        run: |
          xvfb-run -a -s "-screen 0 1000x900x24" timeout 30 \
            python3 -c "
          import tkinter as tk
          import leetcode_guard.status_view as sv
          from leetcode_guard._status_full import gather_full
          root = tk.Tk()
          sv.StatusWindow(root, gather_full(), on_refresh=lambda: None,
                          on_close=root.destroy)
          root.update_idletasks(); root.update(); root.destroy()
          print('status window rendered')
          "

      # Ran only in the local pre-push hook until 2026-09-20, when that became
      # a 1-second stamp check (pre-commit's manual stage holds it now); this
      # is the only other place with an X server to prove it on every push.
      # solved-semantics stays manual-only: it needs kuhy's live LeetCode
      # session and ledger, which CI must never hold.
      - name: Study mode really releases the X grab
        run: |
          xvfb-run -a -s "-screen 0 1600x1200x24" \
            python3 -m scripts.verify_study_grab
