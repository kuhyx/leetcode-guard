name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The `ci-mirror` hook is pre-push only, so it does not run here --
      # which is deliberate. It builds its own venv and runs the whole suite;
      # letting it fire inside CI would nest a second install of everything.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: pre-commit/action@v3.0.1
