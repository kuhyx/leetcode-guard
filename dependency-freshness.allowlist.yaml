# Dependencies held below latest stable in this repo, and why. `transitive:`
# entries are predicates: they clear themselves when the blocker moves, so
# they carry no `expires`.

exceptions:
  - ecosystem: gittag
    package: crdt_sync_flutter
    pinned: "0.8.1"
    reason: >-
      The next release imports package:material_ui; app/ still builds its
      theme on flutter's material.dart (62 deprecated_member_use infos
      measured 2026-11-12), so taking it means migrating app/ to
      material_ui first, as daily-limits did.
    blocked_by: "migration:leetcode-guard app/ to material_ui"
    expires: "2026-12-12"
