# Dependencies held below latest stable in this repo, and why. `transitive:`
# entries are predicates: they clear themselves when the blocker moves, so
# they carry no `expires`.

exceptions:
  - ecosystem: toolchain
    package: python
    pinned: "3.14"
    latest_known: "3.15.2"
    reason: >-
      The guard deploys on Arch's system /usr/bin/python3 (3.14.10, CLAUDE.md
      "The deployment path is system python"), so CI's test jobs test that
      minor. On 3.15 pylint --jobs pickles the linter through dill and
      crashes (pyproject [tool.pylint.main] note), which kept
      test_pylint_dup_memo red from 2026-11-22. Bump when Arch's python is
      3.15. 2026-11-27.
    blocked_by: "arch:python"
    expires: "2027-02-24"
