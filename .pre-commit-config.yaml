# Pre-commit Configuration for leetcode-guard
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files
# Update:   pre-commit autoupdate

default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        # Shared, non-test helpers (fixtures, factories) imported by the
        # real test modules — deliberately not collected as tests, hence the
        # leading underscore rather than a test_/*_test name.
        exclude: ^leetcode_guard/tests/_[a-z][a-z_]*\.py$
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: requirements-txt-fixer

  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
      - id: requirements-sync
        name: requirements.txt covers all package imports
        entry: python3 scripts/check_requirements_sync.py
        language: system
        pass_filenames: false
        files: ^(leetcode_guard/.*\.py|requirements\.txt)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes, --exit-non-zero-on-fix, --show-fixes]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # mypy runs in its own isolated env, so `requests` stubs have to be
        # declared here as well as in requirements.txt or every module that
        # imports requests fails with import-untyped.
        additional_dependencies:
          - types-requests
        args:
          - --ignore-missing-imports
          - --no-error-summary
          - --disable-error-code=no-untyped-def
          - --disable-error-code=no-untyped-call
          - --disable-error-code=var-annotated
          - --disable-error-code=no-any-unimported
          - --disable-error-code=type-arg
          - --disable-error-code=no-any-return
          - --disable-error-code=misc
          - --disable-error-code=unused-ignore
          - --disable-error-code=unreachable
          - --disable-error-code=assignment
          - --disable-error-code=no-redef
          - --disable-error-code=attr-defined
          - --disable-error-code=arg-type
          - --disable-error-code=union-attr
          - --disable-error-code=call-overload
          - --disable-error-code=return-value
          - --disable-error-code=redundant-cast
          - --disable-error-code=empty-body
          - --disable-error-code=list-item

  - repo: https://github.com/pylint-dev/pylint
    rev: v3.3.2
    hooks:
      - id: pylint
        # Whole tree, never the staged subset. `--fail-under` grades a *score*,
        # and a score over an arbitrary handful of files is an arbitrary
        # number: the same tests that sit at 8.55 alongside the package score
        # 7.06 on their own, because duplicate-code between sibling test
        # modules is most of what tests are. CI runs `pre-commit --all-files`,
        # so this is also the only way commit-time and CI agree -- the same
        # "passing or failing by what else was staged" trap the init-hook
        # comment in pyproject.toml describes for import resolution.
        pass_filenames: false
        args:
          - --rcfile=pyproject.toml
          - --fail-under=8.0
          - --jobs=4
          - leetcode_guard
          - scripts
        # Kept byte-identical to pyproject.toml/requirements.txt. This block
        # has drifted from those manifests before, and a pin that lags them
        # lints the code against a gatelock that no longer has the API it
        # calls -- so all three move together, always.
        additional_dependencies:
          - pytest
          - requests
          - gatelock @ git+https://github.com/kuhyx/utils@gatelock-v0.7.1#subdirectory=gatelock
          - crdt-sync @ git+https://github.com/kuhyx/utils@crdt-sync-v0.9.0#subdirectory=crdt-sync
          - mcp>=2,<3
          - pydantic

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args:
          - -c
          - pyproject.toml
          - --severity-level=high
          - --confidence-level=medium
          - --skip=B113
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|.*test.*\.py$)

  - repo: local
    hooks:
      - id: ci-mirror
        name: CI mirror (clean-venv pytest + pre-commit --all-files)
        entry: bash scripts/ci_mirror.sh
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
      # Pre-push rather than pre-commit: it needs a real X server and a few
      # seconds. No unit test can replace it -- over a mocked root a released
      # grab and a held one look identical, which is the exact state the
      # 2026-08-05 lockout was in.
      - id: study-grab
        name: Study mode really releases the X grab (Xvfb)
        entry: >-
          xvfb-run -a -s "-screen 0 1600x1200x24"
          python3 -m scripts.verify_study_grab
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - --skip=*.json,*.lock,.git,__pycache__,.venv,.ci-mirror-venv
          - --ignore-words-list=als,ans,ect,nd,som,sur,te,nam,numer,lew,sie,wil,postion,clen,ther,folow,derrive,ony,tje,noe,theses,crate,doubleclick,wile,tabel,pary,blok,bloc,proces,serwer,parametr,adres,hart,dout,metod,tekst,synonim,grup,mosty,lokal,skalar,milion,nowe,tre,hel,alph

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: bash -c 'printf "%s\0" "$@" | xargs -0 -n 40 shellcheck --severity=warning' --
        language: system
        types: [shell]
      - id: screens-fit
        name: Every lock screen fits 1366x768 (no scrolling required)
        entry: python3 -m scripts.verify_screen_fits
        language: system
        files: '^leetcode_guard/.*\.py$'
        pass_filenames: false
        require_serial: true
      # The shared 250-line cap. This repo used to run a local script with a
      # higher limit under this same hook id, so it looked gated while letting
      # through files every other repo rejects.
      - id: file-length
        name: file length <= 250 lines
        entry: scripts/check_file_length.sh
        language: system
      - id: no-silent-failures
        name: Block silent failures (swallowed exceptions must log why)
        entry: python3 scripts/check_silent_failures.py
        language: system
        types: [python]
      # The fixtures assert what LeetCode's `status` field means, and on
      # 2026-08-14 they asserted it wrongly -- a null was documented as "signed
      # out" when it actually means "never attempted". Every solved-state test
      # passed against that fixture while the code shipped the same error, so
      # this asks the live endpoint instead. Skips loudly (exit 0) when the
      # cookie has expired, because that is a precondition failure and the
      # cookie dies every two weeks; it fails only if the semantics move.
      - id: solved-semantics
        name: LeetCode status still means what the fixtures claim (network)
        entry: python3 -m scripts.verify_solved_semantics
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]

      # Four markdown namespaces (README / CLAUDE* / DOCS* / TODO*), plus the
      # rule that a TODO carries "REMOVE ME AFTER FINISH" and nothing else may.
      # Shared gate in ~/utils owns the namespaces and the exemption list, so
      # one repo's idea of a valid name cannot drift from every other repo's.
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      # Every dependency on its ecosystem's newest STABLE release, exact-pinned
      # so the question is mechanically answerable at all.
      #
      # `files:` is what keeps this cheap: a commit touching only source makes
      # ZERO network requests, and manifest commits mostly hit a 6h disk cache.
      #
      # Runs WITHOUT --strict on purpose. Offline it degrades to the cached
      # answer and passes with a loud banner; `--no-verify` is banned here, so
      # a hook that hard-failed on a flaky connection would leave no way to
      # commit at all. CI, always online, is the strict authority.
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt|uv\.lock
          |package\.json|package-lock\.json|pnpm-lock\.yaml
          |Cargo\.(toml|lock)|go\.(mod|sum)
          |\.fvmrc|\.nvmrc|\.python-version
          |\.github/workflows/.*\.ya?ml)$
