# Pre-commit Configuration for leetcode-guard
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files
# Update:   pre-commit autoupdate

default_language_version:
  python: python3
default_stages: [pre-commit]
fail_fast: false

default_install_hook_types: [pre-commit, pre-push, post-commit, post-merge, post-rewrite]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-ast
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: requirements-txt-fixer

  - repo: local
    hooks:
      - id: no-noqa
        name: Block noqa comments
        entry: '(?i)#\s*(noqa|type:\s*ignore)'
        language: pygrep
        types: [python]
      # monkeypatch.undo() also reverts the autouse path isolation
      # (_paths_fixture): the rest of the test then writes kuhy's real data
      # (2026-11-23: it overwrote the live pool_cache.json). Use
      # monkeypatch.context() for a scoped patch instead.
      - id: no-monkeypatch-undo
        name: Block monkeypatch.undo() in tests
        entry: 'monkeypatch\.undo\(\)'
        language: pygrep
        types: [python]
      - id: no-ruff-noqa
        name: Block ruff noqa file-level comments
        entry: '(?i)#\s*ruff:\s*noqa'
        language: pygrep
        types: [python]
      - id: requirements-sync
        name: requirements.txt covers all package imports
        entry: python3 scripts/check_requirements_sync.py --package leetcode_guard
        language: system
        pass_filenames: false
        files: ^(leetcode_guard/.*\.py|requirements\.txt)$
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # The CI mirror, one hook per stage of scripts/ci_mirror.sh so no single
      # call outlives the 60 s action cap (the old single `ci-mirror` hook took
      # 100+ s). ci-venv runs first so a requirements.txt change pays for the
      # rebuild in its own call; ci-pytest and ci-render re-check the hash and
      # would rebuild themselves if run alone.
      - id: ci-venv
        name: CI mirror - clean venv from requirements.txt
        entry: bash scripts/ci_mirror.sh venv
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-precommit
        name: CI mirror - pre-commit run --all-files
        entry: bash scripts/ci_mirror.sh precommit
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-pytest
        name: CI mirror - pytest -n auto in the clean venv
        entry: bash scripts/ci_mirror.sh pytest
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-render
        name: CI mirror - real-Tk renders under Xvfb (concurrent)
        entry: bash scripts/ci_mirror.sh render
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-1
        name: CI mirror - flutter test 1/4 (private TMPDIR, cached green)
        entry: bash scripts/ci_mirror.sh flutter-test 0/4
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-2
        name: CI mirror - flutter test 2/4 (private TMPDIR, cached green)
        entry: bash scripts/ci_mirror.sh flutter-test 1/4
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-3
        name: CI mirror - flutter test 3/4 (private TMPDIR, cached green)
        entry: bash scripts/ci_mirror.sh flutter-test 2/4
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      - id: ci-mirror-flutter-test-4
        name: CI mirror - flutter test 4/4 (private TMPDIR, cached green)
        entry: bash scripts/ci_mirror.sh flutter-test 3/4
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      # Pre-push rather than pre-commit: it needs a real X server and a few
      # seconds. No unit test can replace it -- over a mocked root a released
      # grab and a held one look identical, which is the exact state the
      # 2026-08-05 lockout was in.
      - id: study-grab
        name: Study mode really releases the X grab (Xvfb)
        entry: >-
          xvfb-run -a -s "-screen 0 1600x1200x24"
          python3 -m scripts.verify_study_grab
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      # The SOLVE row's ``?`` (phase 2 rework chat) is a third way into study
      # mode, on a SOLVE lock: pressed for real, same grab checks.
      - id: rework-grab
        name: A SOLVE row's rework button releases the X grab (Xvfb)
        entry: >-
          xvfb-run -a -s "-screen 0 1600x1200x24"
          python3 -m scripts.verify_study_grab --rework
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      # A restart (SIGTERM, then a new process) keeps study mode: real lock
      # processes on a real X server, judged by holds_grab(). A mocked root
      # cannot tell a released grab from a held one, so no unit test can.
      - id: restart-study
        name: A restart keeps study mode, grab released (Xvfb)
        entry: >-
          xvfb-run -a -s "-screen 0 1600x1200x24"
          python3 -m scripts.verify_restart_study
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      # The review-first row, end to end: the real lock per scenario, each on
      # its own Xvfb (row shown, swap on the tutor's rename, planted file,
      # failed spawn, working launcher, demo). The id is snake_case on purpose:
      # it is the module name, and the todo done_check greps for it.
      - id: verify_review_first
        name: Review-first row on a real lock (Xvfb)
        entry: >-
          xvfb-run -a -s "-screen 0 1600x1200x24"
          python3 -m scripts.verify_review_first
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]
      # Same reason, for stacking: over a mocked root a tooltip buried under a
      # surface gatelock keeps raising looks shown (live demo, 2026-11-22).
      - id: tooltip-stack
        name: Tooltips stay above a raised lock surface (Xvfb)
        entry: >-
          xvfb-run -a -s "-screen 0 1600x1200x24"
          python3 -m scripts.verify_tooltip_stack
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

  - repo: local
    hooks:
      - id: screens-fit
        name: Every lock screen fits 1366x768 (no scrolling required)
        entry: python3 -m scripts.verify_screen_fits
        language: system
        files: '^leetcode_guard/.*\.py$'
        pass_filenames: false
        require_serial: true
      - id: no-silent-failures
        name: Block silent failures (swallowed exceptions must log why)
        entry: python3 scripts/check_silent_failures.py
        language: system
        types: [python]
      # The fixtures assert what LeetCode's `status` field means, and on
      # 2026-08-14 they asserted it wrongly -- a null was documented as "signed
      # out" when it actually means "never attempted". Every solved-state test
      # passed against that fixture while the code shipped the same error, so
      # this asks the live endpoint instead. Skips loudly (exit 0) when the
      # cookie has expired, because that is a precondition failure and the
      # cookie dies every two weeks; it fails only if the semantics move.
      - id: solved-semantics
        name: LeetCode status still means what the fixtures claim (network)
        entry: python3 -m scripts.verify_solved_semantics
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # The fixtures for recentSubmissionList (every status, public, 20 rows)
      # repeat what was measured on 2026-11-21. This asks the live endpoint
      # whether the keys, the string timestamp and the 20-row cap still hold.
      # No cookie needed; skips loudly (exit 0) when LeetCode cannot be
      # reached or answers "could not check", fails only if the shape moved.
      - id: recent-submissions
        name: recentSubmissionList still has the fixtures' shape (network)
        entry: python3 -m scripts.verify_recent_submissions
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [manual]

      # Four markdown namespaces (README / CLAUDE* / DOCS* / TODO*), plus the
      # rule that a TODO carries "REMOVE ME AFTER FINISH" and nothing else may.
      # Shared gate in ~/src/utils owns the namespaces and the exemption list, so
      # one repo's idea of a valid name cannot drift from every other repo's.
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$

      - id: todo-closer
        name: close Todo trailer tasks
        entry: scripts/todo_hooks.sh closer
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-merge
        name: import PR Todo sections (pull)
        entry: scripts/todo_hooks.sh import-pr post-merge
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false

      - id: todo-import-pr-rewrite
        name: import PR Todo sections (pull --rebase)
        entry: scripts/todo_hooks.sh import-pr post-rewrite
        language: system
        stages: [post-rewrite]
        always_run: true
        pass_filenames: false

      # Every dependency on its ecosystem's newest STABLE release, exact-pinned
      # so the question is mechanically answerable at all.
      #
      # `files:` is what keeps this cheap: a commit touching only source makes
      # ZERO network requests, and manifest commits mostly hit a 6h disk cache.
      #
      # Runs WITHOUT --strict on purpose. Offline it degrades to the cached
      # answer and passes with a loud banner; `--no-verify` is banned here, so
      # a hook that hard-failed on a flaky connection would leave no way to
      # commit at all. Local-only on purpose: CI skips this hook and has no
      # freshness workflow, so an upstream release cannot turn CI red.
      - id: dependency-freshness
        name: dependencies on newest stable
        entry: scripts/check_dependency_freshness.sh
        language: system
        pass_filenames: true
        files: >-
          (pubspec\.(yaml|lock)|pyproject\.toml|requirements.*\.txt|uv\.lock
          |package\.json|package-lock\.json|pnpm-lock\.yaml
          |Cargo\.(toml|lock)|go\.(mod|sum)
          |\.fvmrc|\.nvmrc|\.python-version
          |\.github/workflows/.*\.ya?ml)$

  - repo: local
    hooks:
      # The only pre-push hook. Everything that used to run here is now
      # `stages: [manual]` -- run on demand with `scripts/check_gate_stamp.sh
      # full`, and by CI on every push. finish_auto.sh stamps HEAD after its
      # gate; a tree without that receipt cannot leave the machine.
      - id: gate-stamp
        name: pushed tree passed the local gate (stamp check)
        entry: scripts/check_gate_stamp.sh check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
